<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Moonbase Defender</title>
  <style>body { margin: 0; overflow: hidden; }</style>
  <link rel="icon" href="data:,">
</head>
<body>
  <div id="crosshair">+</div>

  <div id="health-bar-container">
  <div id="health-bar"></div>
  <div id="activation-prompt">Press E to activate crystal</div>

</div>


  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.158.0/build/three.module.js",
      "three/addons/controls/PointerLockControls.js": "https://unpkg.com/three@0.158.0/examples/jsm/controls/PointerLockControls.js",
      "three/addons/loaders/GLTFLoader.js": "https://unpkg.com/three@0.158.0/examples/jsm/loaders/GLTFLoader.js"
    }
  }
  </script>

  <script type="module" src="./main.js"></script>

  <canvas id="minimap" width="200" height="200"></canvas>

  <style>
    #crosshair {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 24px;
      color: white;
      pointer-events: none;
      z-index: 10;
      font-family: monospace;
    }

#health-bar-container {
  position: fixed;
  bottom: 20px;
  right: 20px;
  width: 200px;
  height: 20px;
  border: 2px solid #fff;
  background-color: rgba(255, 255, 255, 0.1);
  z-index: 999;
}
#health-bar {
  height: 100%;
  width: 100%;
  background-color: limegreen;
  transition: width 0.2s ease;
}

#minimap {
  position: fixed;
  bottom: 20px;
  left: 20px;
  width: 150px;
  height: 150px;
  border-radius: 50%;
  border: 2px solid white;
  background-color: rgba(0, 0, 0, 0.6);
  z-index: 999;
}

#activation-prompt {
  position: fixed;
  bottom: 90px;
  left: 50%;
  transform: translateX(-50%);
  color: white;
  font-size: 20px;
  font-family: monospace;
  background: rgba(0, 0, 0, 0.5);
  padding: 8px 14px;
  border-radius: 6px;
  display: none;
  z-index: 1000;
}


  </style>
</body>
</html>
