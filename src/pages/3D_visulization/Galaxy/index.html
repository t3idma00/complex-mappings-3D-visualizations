<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Interactive Solar System</title>
  <style>
    body { margin: 0; overflow: hidden; background: black; }
    canvas { display: block; }

    #popup {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(0,0,0,0.75);
      color: #fff;
      padding: 12px 18px;
      border-radius: 8px;
      font-family: sans-serif;
      font-size: 14px;
      max-width: 300px;
      line-height: 1.4;
      z-index: 999;
      display: none;
    }

    #dateDisplay {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: white;
      font-family: sans-serif;
      font-size: 16px;
      z-index: 1000;
    }

    #controlPanel {
      position: absolute;
      top: 80px;
      right: 20px;
      background: rgba(255, 255, 255, 0.1);
      color: white;
      padding: 15px;
      border-radius: 10px;
      font-family: sans-serif;
      z-index: 999;
      max-height: 80vh;
      overflow: auto;
      width: 240px;
    }

    .planet-group {
      margin-bottom: 15px;
    }


    
    .planet-group label {
      display: block;
      font-size: 12px;
      margin-bottom: 4px;
    }

    .planet-group input[type="range"] {
      width: 100%;
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.158.0/build/three.module.js",
        "three/addons/controls/OrbitControls.js": "https://unpkg.com/three@0.158.0/examples/jsm/controls/OrbitControls.js",
        "cannon-es": "https://cdn.skypack.dev/cannon-es"
      }
    }
  </script>
</head>
<body>
  <div id="dateDisplay"></div>
  <div id="popup"></div>
<button id="exitPlanetButton" style="
  position: absolute;
  top: 20px;
  right: 50%;
  transform: translateX(50%);
  z-index: 999;
  display: none;
  padding: 10px 20px;
  font-size: 14px;
  background: #ffcc00;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
">🚀 Exit Planet View</button>


<div id="controlPanel">

</div>
  <script type="module" src="main.js"></script>
</body>
</html>
