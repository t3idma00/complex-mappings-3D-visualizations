<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Conformal Mapping: Grid Only</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.min.js"></script>
  <link rel="stylesheet" href="styles.css" />

</head>
<body>
  <h2>Conformal Mapping: Grid of Square Cells</h2>
  <div class="container">
    <div>
      <h3>Square Panel</h3>
      <p class="caption">Original square grid</p>
      <svg id="square" width="400" height="400"></svg>
    </div>
    <div>
      <h3>Disk Panel</h3>
      <p class="caption">Mapped grid preserving angles</p>
      <svg id="disk" width="400" height="400"></svg>
    </div>
  </div>
  <script src="main.js"></script>

</body>
</html>
