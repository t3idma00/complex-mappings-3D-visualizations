<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riemann Mapping Visualization</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/mathjs@11.3.1/lib/browser/math.js"></script>
    <script src="main.js" defer></script>
    
</head>
<body>
    <h1>Riemann Mapping Visualization</h1>
    
    <div class="container">
        <div class="canvas-container">
            <h2>Original Grid</h2>
            <canvas id="originalCanvas" width="400" height="400"></canvas>
        </div>
        
        <div class="canvas-container">
            <h2>Transformed Grid</h2>
            <canvas id="mappedCanvas" width="400" height="400"></canvas>
            <div class="legend">
                <div class="legend-item">
                    <div class="legend-color" style="background: #4285f4;"></div>
                    <span>Transformed Grid</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: #9b59b6;"></div>
                    <span>Selected Point</span>
                </div>
            </div>
        </div>
        
        <div class="controls">
            <h3>Controls</h3>
            
            <div class="control-group">
                <label for="realPart">Real Part of ζ (Target Point)</label>
                <input type="range" id="realPart" min="-3" max="3" step="0.1" value="2">
                <div class="value-display" id="realValue">2.0</div>
            </div>
            
            <div class="control-group">
                <label for="imagPart">Imaginary Part of ζ (Target Point)</label>
                <input type="range" id="imagPart" min="-3" max="3" step="0.1" value="2">
                <div class="value-display" id="imagValue">2.0</div>
            </div>
            
            <div class="control-group">
                <label for="gridSize">Grid Resolution</label>
                <input type="range" id="gridSize" min="5" max="50" step="1" value="20">
                <div class="value-display" id="gridSizeValue">20</div>
            </div>
            
            <div class="control-group">
                <label for="animationSpeed">Animation Speed</label>
                <input type="range" id="animationSpeed" min="0" max="100" step="1" value="50">
                <div class="value-display" id="speedValue">50</div>
            </div>
            
            <button id="animateBtn">Animate Transformation</button>
        </div>
    </div>
    
    <div class="info">
        <h2>About Riemann Mapping</h2>

    </div>

    
</body>
</html>
