<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Conformal Mapping: Image to Disk</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.min.js"></script>
  <link rel="stylesheet" href="styles.css" />
 
</head>
<body>
  <div class="controls">
    <h2>Image to Disk Conformal Mapping</h2>
    <input type="file" id="imageUpload" accept="image/*">
    <p class="caption">Add an image to map it to the unit disk</p>
  </div>

  <div class="container">
    <div>
      <h3>Original Image</h3>
      <p class="caption">Will be scaled to fit [-1,1] × [-1,1] square</p>
      <svg id="square" width="400" height="400"></svg>
    </div>
    <div>
      <h3>Mapped to Disk</h3>
      <p class="caption">Conformal mapping result</p>
      <svg id="disk" width="400" height="400"></svg>
    </div>
  </div>
  <script src="main.js"></script>


</body>
</html>
