<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Tilt Maze Game</title>
    <style>
        body { margin: 0; overflow: hidden; }
        canvas { display: block; }
        #instructions {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            background: rgba(0,0,0,0.5);
            padding: 10px;
            font-family: Arial, sans-serif;
        }
        #win-message, #lose-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            padding: 20px;
            font-size: 24px;
            font-family: Arial, sans-serif;
            display: none;
        }
        #win-message {
            background: rgba(0, 200, 0, 0.7);
        }
        #lose-message {
            background: rgba(200, 0, 0, 0.7);
        }
    </style>
</head>
<body>
    <div id="instructions">
        Tilt the board using arrow keys to guide the ball. Avoid black holes but reach the red goal hole!
    </div>
    <div id="win-message">
        You Win! Refresh to play again.
    </div>
    <div id="lose-message">
        Game Over! Refresh to try again.
    </div>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/build/three.min.js"></script>
    <script src="game.js"></script>
</body>
</html>
